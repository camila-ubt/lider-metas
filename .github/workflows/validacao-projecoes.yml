name: Validacao das projecoes

on:
  pull_request:
    paths:
      - "src/lib/projecaoTurnos.mjs"
      - "tests/consistenciaProjecoes.test.mjs"
      - "src/lib/analiseGerencial.js"
      - "src/lib/historicoMes.mjs"
      - "tests/historicoMes.test.mjs"
      - "src/components/AcompanhamentoTurno.js"
      - "src/components/AppEnhancements.js"
      - "src/lib/probabilidadesHistoricas.mjs"
      - "src/lib/validacaoProbabilidades.mjs"
      - "src/components/LaboratorioCalibracao.js"
      - "tests/validacaoProbabilidades.test.mjs"
      - "src/lib/calibracaoProbabilidades.mjs"
      - "src/lib/qualidadeDados.mjs"
      - "src/components/RegistroPrevisoes.js"
      - "tests/calibracaoProbabilidades.test.mjs"
      - "tests/qualidadeDados.test.mjs"
      - "supabase/migrations/20261121014500_previsoes_diarias_calibracao.sql"
      - "src/components/ProbabilidadesMetas.js"
      - "tests/probabilidadesHistoricas.test.mjs"
      - "src/lib/validacaoProjecoes.mjs"
      - "tests/validacaoProjecoes.test.mjs"
      - "tests/projecaoTurnos.test.mjs"
      - "tests/indicadoresGerenciais.test.mjs"
      - "tests/periodoMaisAtrasado.test.mjs"
      - "src/lib/indicadoresGerenciais.mjs"
      - "src/lib/periodoMaisAtrasado.mjs"
      - "src/components/DashboardEstavelV2.js"
      - "src/components/InteligenciaGerencial.js"
      - "src/components/PainelReuniao.js"
      - "src/components/ResumoLojasFechamento.js"
      - "src/components/LaboratorioValidacao.js"
      - "tests/laboratorioLeitura.test.mjs"
      - "tests/padroesNiveis.test.mjs"
      - "src/components/FechamentoMensal.js"
      - "src/components/ResumoLojasFechamento.js"
      - "src/components/AnaliseGerencial.js"
      - "src/components/LiderMetas.js"
      - ".github/workflows/validacao-projecoes.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar calculos de previsao e backtest
        run: node --test tests/probabilidadesHistoricas.test.mjs tests/projecaoTurnos.test.mjs tests/indicadoresGerenciais.test.mjs tests/periodoMaisAtrasado.test.mjs tests/validacaoProjecoes.test.mjs tests/laboratorioLeitura.test.mjs tests/padroesNiveis.test.mjs tests/consistenciaProjecoes.test.mjs tests/historicoMes.test.mjs tests/calibracaoProbabilidades.test.mjs tests/qualidadeDados.test.mjs tests/validacaoProbabilidades.test.mjs
