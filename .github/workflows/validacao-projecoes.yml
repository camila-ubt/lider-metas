name: Validacao das projecoes

on:
  pull_request:
    paths:
      - "src/lib/projecaoTurnos.mjs"
      - "src/lib/validacaoProjecoes.mjs"
      - "tests/validacaoProjecoes.test.mjs"
      - "tests/padroesNiveis.test.mjs"
      - "src/components/FechamentoMensal.js"
      - "src/components/ResumoLojasFechamento.js"
      - "src/components/AnaliseGerencial.js"
      - "src/components/LiderMetas.js"
      - ".github/workflows/validacao-projecoes.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar calculos de previsao e backtest
        run: node --test tests/validacaoProjecoes.test.mjs tests/padroesNiveis.test.mjs
